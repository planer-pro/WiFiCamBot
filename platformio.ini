; ESP32-S3 (N16R8) + OV2640: веб-страница с живым MJPEG-потоком
; Драйвер камеры (esp32-camera) уже встроен в ядро arduino-esp32 2.0.17 — lib_deps не нужен.
[env:esp32s3_cam]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; --- N16R8: 16 МБ quad flash + 8 МБ octal PSRAM ---
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv
board_build.flash_mode          = qio
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial -> нативный USB (/dev/ttyACM0) — порт, через который шьём

; Раскомментируйте при отладке:
; monitor_filters = esp32_exception_decoder
; build_flags += -DCORE_DEBUG_LEVEL=3
