; ESP32-S3 (N16R8) + OV2640: веб-страница с живым MJPEG-потоком
; Драйвер камеры (esp32-camera) уже встроен в ядро arduino-esp32 2.0.17 — lib_deps не нужен.

; Обычная «pio run»/«pio run -t upload» без -e работает только с USB-env,
; чтобы не пытаться заодно шить по сети.
[platformio]
default_envs = esp32s3_cam

[env:esp32s3_cam]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

; --- N16R8: 16 МБ quad flash + 8 МБ octal PSRAM ---
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv
board_build.flash_mode          = qio
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial -> нативный USB (/dev/ttyACM0) — порт, через который шьём

; Раскомментируйте при отладке:
; monitor_filters = esp32_exception_decoder
; build_flags += -DCORE_DEBUG_LEVEL=3

; --- OTA: прошивка платы по WiFi, без USB-кабеля ---------------------------
; Работает после того, как прошивка с ArduinoOTA хоть раз залита по USB.
; Использование:   pio run -d . -e ota -t upload
; Адрес — mDNS-имя платы (или её IP, если .local не резолвится).
; Если в src/wifi_secrets.h задан OTA_PASSWORD — раскомментируйте --auth.
[env:ota]
extends         = env:esp32s3_cam
upload_protocol = espota
upload_port     = esp32cam.local
; upload_flags   = --auth=ВАШ_ПАРОЛЬ
